id: palo_alto_traffic_csv
description: >
  Palo Alto Networks PAN-OS traffic log in CSV syslog form. Carries App-ID,
  zones, NAT translation, byte counts and session duration — the fields needed
  for beaconing and transfer-volume analysis.
format: csv
priority: 1

match:
  filename_patterns:
    - "*firewall*.log"
    - "*traffic*.log"
    - "*panos*.csv"
  content_patterns:
    - "TRAFFIC"
    - "PAN-OS"

# Records are emitted through syslog, so each CSV row is preceded by an
# RFC3164 header ("<pri>Mon dd hh:mm:ss host "). Strip it before column
# splitting; the verbatim line is still preserved as evidence.
line_prefix_pattern: '^<\d+>\w{3}\s+\d{1,2}\s+\d{2}:\d{2}:\d{2}\s+\S+\s+'

# PAN-OS traffic logs are headerless positional CSV. Column names follow the
# PAN-OS 10.x/11.x TRAFFIC log field order; trailing fields beyond
# device_name are not needed and are left unnamed.
columns:
  - future_use_1
  - receive_time
  - serial
  - type
  - subtype
  - future_use_2
  - time_generated
  - src
  - dst
  - natsrc
  - natdst
  - rule
  - srcuser
  - dstuser
  - app
  - vsys
  - from
  - to
  - inbound_if
  - outbound_if
  - log_action
  - future_use_3
  - sessionid
  - repeatcnt
  - sport
  - dport
  - natsport
  - natdport
  - flags
  - proto
  - action
  - bytes
  - bytes_sent
  - bytes_received
  - packets
  - start_time
  - elapsed_time
  - category
  - future_use_4
  - seqno
  - actionflags
  - srcloc
  - dstloc
  - future_use_5
  - pkts_sent
  - pkts_received
  - session_end_reason
  - dg_hier_level_1
  - dg_hier_level_2
  - dg_hier_level_3
  - dg_hier_level_4
  - vsys_name
  - device_name

fields:
  timestamp: [time_generated, receive_time, Time, generated_time]
  src_ip: [src, source_address, Source, source_ip]
  dst_ip: [dst, destination_address, Destination, destination_ip]
  src_port: [sport, source_port]
  dst_port: [dport, destination_port, Destination Port]
  protocol: [proto, protocol, IP Protocol]
  app_id: [app, application, Application]
  action: [action, Action]
  bytes_sent: [bytes_sent, Bytes Sent, bytes_from_client]
  bytes_received: [bytes_received, Bytes Received, bytes_from_server]
  session_duration: [elapsed_time, Elapsed Time, duration]
  user: [srcuser, source_user, Source User]
  host: [device_name, Device Name]
  geo.country: [dstloc, Destination Location]
  extra.source_zone: [from, source_zone, Source Zone]
  extra.destination_zone: [to, destination_zone, Destination Zone]
  extra.session_id: [sessionid, Session ID]
  extra.rule: [rule, Rule]
  extra.nat_source: [natsrc, NAT Source IP]
  extra.session_end_reason: [session_end_reason, Session End Reason]

constants:
  status: info
