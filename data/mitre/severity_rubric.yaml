# Severity rubric.
#
# Severity is computed, not felt. The score is a product of three independent
# factors so that the same technique scores differently depending on whether it
# succeeded and on what it touched. No per-incident tuning.
#
#   score = tactic_weight x outcome_multiplier x asset_multiplier
#
# All weights are generic properties of the tactic, drawn from where the tactic
# sits in the kill chain and how much irreversible harm it enables.

tactic_weights:
  Reconnaissance: 1
  "Resource Development": 1
  "Initial Access": 7
  Execution: 6
  Persistence: 7
  "Privilege Escalation": 8
  "Defense Evasion": 5
  "Credential Access": 8
  Discovery: 3
  "Lateral Movement": 7
  Collection: 6
  "Command and Control": 6
  Exfiltration: 9
  Impact: 10

# Did the observed activity achieve its objective?
outcome_multipliers:
  succeeded: 1.0
  attempted: 0.5
  blocked: 0.2
  unknown: 0.6

# What kind of asset was involved. Classification comes from evidence-derived
# role signals, never from a hardcoded hostname.
asset_multipliers:
  identity_provider: 1.3
  domain_controller: 1.3
  server: 1.1
  endpoint: 1.0
  unknown: 1.0

# Score bands. Boundaries are round numbers chosen before any dataset was
# scored and are not adjusted to move a specific case across a threshold.
bands:
  - { min: 9.0, severity: CRITICAL }
  - { min: 6.5, severity: HIGH }
  - { min: 3.5, severity: MEDIUM }
  - { min: 0.0, severity: LOW }

# Generic role signals used to classify an asset from evidence alone. Matched
# against the event's source_type and action fields, never against a hostname
# literal.
role_signals:
  identity_provider:
    - signin
    - "sign-in"
    - idp
    - oauth
    - saml
    - azuread
    - okta
  domain_controller:
    - kerberos
    - ntds
    - "directory service"
    - "4768"
    - "4769"
