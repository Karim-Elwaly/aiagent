services:
  # ── Temporal Local Dev Server (Server + Web UI) ────────────────
  temporal:
    image: temporalio/temporal:latest
    container_name: uaos-temporal
    command: ["server", "start-dev", "--ip", "0.0.0.0", "--ui-port", "8233"]
    ports:
      - "7234:7233"  # gRPC API (Host 7234 -> Container 7233)
      - "8234:8233"  # Temporal Web UI (Host 8234 -> Container 8233)
    restart: unless-stopped

  # ── SearXNG (Self-Hosted Private Search Backend) ───────────────
  searxng:
    image: searxng/searxng:latest
    container_name: uaos-searxng
    ports:
      - "8080:8080"
    environment:
      - SEARXNG_BASE_URL=http://localhost:8080
    restart: unless-stopped

  # ── UAOS API Gateway ───────────────────────────────────────────
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: uaos-api
    ports:
      - "8000:8000"
    environment:
      - TEMPORAL_HOST=temporal:7233
      - LLM_BASE_URL=http://host.docker.internal:11434/v1
      - SEARXNG_URL=http://searxng:8080
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      - temporal
    restart: unless-stopped

  # ── UAOS Temporal Worker Runner ────────────────────────────────
  worker:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: uaos-worker
    command: ["python", "-m", "src.orchestrator.worker_runner"]
    environment:
      - TEMPORAL_HOST=temporal:7233
      - LLM_BASE_URL=http://host.docker.internal:11434/v1
      - SEARXNG_URL=http://searxng:8080
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      - temporal
    restart: unless-stopped
