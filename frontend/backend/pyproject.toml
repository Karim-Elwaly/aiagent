[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "fleet-studio-backend"
version = "0.1.0"
description = "Governance and desired-state control plane for Hermes agent fleets"
requires-python = ">=3.12"
dependencies = [
  "alembic>=1.13,<2",
  "authlib>=1.3,<2",
  "apscheduler>=3.10,<4",
  "fastapi>=0.115,<1",
  "httpx>=0.27,<1",
  "itsdangerous>=2.2,<3",
  "opentelemetry-api>=1.27,<2",
  "opentelemetry-exporter-otlp-proto-http>=1.27,<2",
  "opentelemetry-instrumentation-fastapi>=0.48b0,<1",
  "opentelemetry-sdk>=1.27,<2",
  "pydantic-settings>=2.6,<3",
  "python-multipart>=0.0.18",
  "jsonschema>=4.23,<5",
  "sqlalchemy[asyncio]>=2.0,<3",
  "asyncpg>=0.30,<1",
  "uvicorn[standard]>=0.30,<1",
  "websockets>=13,<16",
]

[project.optional-dependencies]
dev = ["aiosqlite>=0.20,<1", "httpx>=0.27,<1", "pytest>=8,<9", "pytest-asyncio>=0.24,<1", "ruff>=0.8,<1"]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
