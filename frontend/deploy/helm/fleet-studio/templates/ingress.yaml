{{- if .Values.ingress.enabled }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "fleet-studio.fullname" . }}
  labels:
    {{- include "fleet-studio.labels" . | nindent 4 }}
spec:
  ingressClassName: {{ .Values.ingress.className }}
  tls:
    - hosts: [{{ .Values.ingress.host | quote }}]
      secretName: {{ .Values.ingress.tlsSecretName }}
  rules:
    - host: {{ .Values.ingress.host | quote }}
      http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: {{ include "fleet-studio.fullname" . }}-api
                port:
                  number: {{ .Values.service.backendPort }}
          - path: /auth
            pathType: Prefix
            backend:
              service:
                name: {{ include "fleet-studio.fullname" . }}-api
                port:
                  number: {{ .Values.service.backendPort }}
          - path: /health
            pathType: Prefix
            backend:
              service:
                name: {{ include "fleet-studio.fullname" . }}-api
                port:
                  number: {{ .Values.service.backendPort }}
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ include "fleet-studio.fullname" . }}-web
                port:
                  number: {{ .Values.service.frontendPort }}
{{- end }}