apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "fleet-studio.fullname" . }}-api
  labels:
    {{- include "fleet-studio.labels" . | nindent 4 }}
    app.kubernetes.io/component: api
spec:
  replicas: {{ .Values.replicaCount.backend }}
  selector:
    matchLabels:
      app.kubernetes.io/instance: {{ .Release.Name }}
      app.kubernetes.io/component: api
  template:
    metadata:
      labels:
        app.kubernetes.io/instance: {{ .Release.Name }}
        app.kubernetes.io/component: api
    spec:
      nodeSelector:
        {{- toYaml .Values.placement.nodeSelector | nindent 8 }}
      tolerations:
        {{- toYaml .Values.placement.tolerations | nindent 8 }}
      affinity:
        {{- toYaml .Values.placement.affinity | nindent 8 }}
      containers:
        - name: api
          image: {{ .Values.image.backend | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.service.backendPort }}
          envFrom:
            - configMapRef:
                name: {{ include "fleet-studio.fullname" . }}-config
          env:
            - name: FLEET_STUDIO_DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secrets.databaseSecretName }}
                  key: database-url
            - name: FLEET_STUDIO_SESSION_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secrets.sessionSecretName }}
                  key: session-secret
            - name: FLEET_STUDIO_OIDC_CLIENT_ID
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secrets.oidcSecretName }}
                  key: client-id
            - name: FLEET_STUDIO_OIDC_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secrets.oidcSecretName }}
                  key: client-secret
            - name: FLEET_STUDIO_HERMES_API_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secrets.hermesSecretName }}
                  key: api-token
                  optional: true
            - name: FLEET_STUDIO_DAEMON_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secrets.daemonSecretName }}
                  key: daemon-token
                  optional: true
            - name: FLEET_STUDIO_WEBHOOK_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secrets.webhookSecretName }}
                  key: webhook-secret
                  optional: true
            - name: FLEET_STUDIO_SMTP_USERNAME
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secrets.smtpSecretName }}
                  key: username
                  optional: true
            - name: FLEET_STUDIO_SMTP_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secrets.smtpSecretName }}
                  key: password
                  optional: true
            - name: FLEET_STUDIO_OUTPUT_WEBHOOK_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secrets.outputWebhookSecretName }}
                  key: token
                  optional: true
            - name: FLEET_STUDIO_OTEL_EXPORTER_OTLP_HEADERS
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secrets.otelSecretName }}
                  key: headers-json
                  optional: true
          readinessProbe:
            httpGet: { path: /health, port: http }
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /health, port: http }
            initialDelaySeconds: 15
            periodSeconds: 20
          resources:
            {{- toYaml .Values.resources.backend | nindent 12 }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "fleet-studio.fullname" . }}-api
  labels:
    {{- include "fleet-studio.labels" . | nindent 4 }}
spec:
  selector:
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/component: api
  ports:
    - name: http
      port: {{ .Values.service.backendPort }}
      targetPort: http