apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "fleet-studio.fullname" . }}-web
  labels:
    {{- include "fleet-studio.labels" . | nindent 4 }}
    app.kubernetes.io/component: web
spec:
  replicas: {{ .Values.replicaCount.frontend }}
  selector:
    matchLabels:
      app.kubernetes.io/instance: {{ .Release.Name }}
      app.kubernetes.io/component: web
  template:
    metadata:
      labels:
        app.kubernetes.io/instance: {{ .Release.Name }}
        app.kubernetes.io/component: web
    spec:
      nodeSelector:
        {{- toYaml .Values.placement.nodeSelector | nindent 8 }}
      tolerations:
        {{- toYaml .Values.placement.tolerations | nindent 8 }}
      affinity:
        {{- toYaml .Values.placement.affinity | nindent 8 }}
      containers:
        - name: web
          image: {{ .Values.image.frontend | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.service.frontendPort }}
          env:
            - name: NEXT_PUBLIC_API_URL
              value: ""
          readinessProbe:
            httpGet: { path: /, port: http }
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            {{- toYaml .Values.resources.frontend | nindent 12 }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "fleet-studio.fullname" . }}-web
  labels:
    {{- include "fleet-studio.labels" . | nindent 4 }}
spec:
  selector:
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/component: web
  ports:
    - name: http
      port: {{ .Values.service.frontendPort }}
      targetPort: http